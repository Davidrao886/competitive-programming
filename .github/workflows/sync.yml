name: Dual CP Archive Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Archiver
        env:
          CF_HANDLE: ${{ secrets.CF_HANDLE }}
          LC_USERNAME: ${{ secrets.LC_USERNAME }}
        run: python scripts/sync_cp.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "sync: auto-archive accepted solutions from CF & LC [skip ci]" && git push)
